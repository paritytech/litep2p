[package]
name = "webrtc-codec"
version = "0.1.0"
edition = "2024"

[dependencies]
ziggy = { version = "1.3.1", default-features = false }
litep2p = { path = "../..", features = ["webrtc", "fuzz"] }
bytes = "1.10.1"
unsigned-varint = "0.8.0"

# Fuzzing a parser with `debug_assert!` compiled out hides exactly the bugs we are
# looking for, and `overflow-checks` turns silent wraparound in the framing arithmetic
# into a crash the fuzzer can report.
[profile.release]
debug-assertions = true
overflow-checks = true

[[bin]]
name = "webrtc-codec"
path = "src/main.rs"

# Regenerates the committed seed corpus; not part of fuzzing.
[[bin]]
name = "gen_seeds"
path = "src/gen_seeds.rs"
