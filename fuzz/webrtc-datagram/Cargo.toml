[package]
name = "webrtc-datagram"
version = "0.1.0"
edition = "2024"

[dependencies]
ziggy = { version = "1.3.1", default-features = false }
litep2p = { path = "../..", features = ["webrtc"] }
# `test-util` gives the harness `start_paused`, so the transport can be driven without
# spending real wall-clock time per iteration.
tokio = { version = "1.44.1", features = ["full", "test-util"] }
multiaddr = "0.18.2"
futures = "0.3.31"
# Only used by `gen_seeds` to build valid STUN binding requests. Version and features match the
# transitive dep pulled in by litep2p so the build unifies rather than compiling a second str0m.
str0m = { version = "0.22.0", default-features = false, features = ["openssl", "vendored"] }

[profile.release]
debug-assertions = true
overflow-checks = true

[[bin]]
name = "webrtc-datagram"
path = "src/main.rs"

# Regenerates the committed certificate fixture; not part of fuzzing.
[[bin]]
name = "gen_fixture"
path = "src/gen_fixture.rs"

# Regenerates the committed STUN seed corpus; not part of fuzzing.
[[bin]]
name = "gen_seeds"
path = "src/gen_seeds.rs"
