[package]
name = "webrtc-datagram"
version = "0.1.0"
edition = "2024"

[dependencies]
ziggy = { version = "1.3.1", default-features = false }
# `fuzz` exposes the Noise responder helper, `util::WebRtcMessage`, and `extract_framed_message`
# used to complete and frame the handshake from the client side.
litep2p = { path = "../..", features = ["webrtc", "fuzz"] }
bytes = "1.10.1"
# `test-util` gives the harness `start_paused`, so the transport can be driven without
# spending real wall-clock time per iteration.
tokio = { version = "1.44.1", features = ["full", "test-util"] }
multiaddr = "0.18.2"
# The end-to-end client (`src/client.rs`) drives a real str0m `Rtc` against the litep2p listener.
# Version and features match the transitive dep pulled in by litep2p so the build unifies rather
# than compiling a second str0m.
str0m = { version = "0.23.1", default-features = false, features = ["openssl", "vendored"] }


[[bin]]
name = "webrtc-datagram"
path = "src/main.rs"

# Regenerates the committed STUN seed corpus; not part of fuzzing.
[[bin]]
name = "gen_seeds"
path = "src/gen_seeds.rs"
